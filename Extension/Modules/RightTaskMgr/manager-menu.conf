## manager-menu.conf

#  USER APPLICATION SELECTION PROFILE
#  Edit these lists which apps go into which vertical panels.
#  Check application class name with FvwmIdent (menu: Identify)
#  After editing press: Ctrl + R to reload and restart.
# =============================================================

# --- 1. Development & System Control ---
InfoStoreAdd AppGroup_DevSys "XTerm Alacritty kitty code-oss Xfce4-terminal Thunar Nemo featherpad Gedit Kate"

# --- 2. Web & Communication ---
InfoStoreAdd AppGroup_WebCom "firefox Chromium Brave-browser Zathura thunderbird* Evolution"

# --- 3. Graphics & Media ---
InfoStoreAdd AppGroup_GraphMed "discord Slack Spotify mpv Gimp* vlc scribus Blender Krita Inkscape ColorPicker"

#  Edit Menu
# ============

DestroyMenu MenuPanel
AddToMenu MenuPanel
+ "Restart " Restart
+ "Identify " Module FvwmIdent
Test (x FvwmPrompt) + "Fvwm Prompt " Exec exec xterm "FvwmPrompt"
Test (!x FvwmPrompt) + "Fvwm Console " Module FvwmConsole -terminal
+ "Window List " TriggerWindowLookUp
+ "" Nop
+ "Apps Edit " $[infostore.EDT] $[EXT_DIR]/Modules/RightTaskMgr/manager-menu.conf
+ "Bindings  " $[infostore.EDT] $[EXT_DIR]/Modules/RightTaskMgr/taskBarMouseB.txt
+ "Fvwm Wallpapers" Popup BGMenu item -0 +17m

# Press Ctrl + R to read the file and fully restart, after editing.
Key R A C ReloadAndRestart

DestroyFunc ReloadAndRestart
AddToFunc   ReloadAndRestart
+ I PipeRead 'echo "Read $[EXT_DIR]/Modules/manager-menu.conf"'
+ I Restart
