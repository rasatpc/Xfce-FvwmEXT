# manager-menu.conf

#  USER APPLICATION SELECTION PROFILE
#  Edit these lists to control which apps go into each vertical panel.
#  Check application class names with FvwmIdent (Menu -> Identify).
#  After editing, press Ctrl + R to reload and restart.
# =====================================================================

# --- 1. Development & System Control ---
InfoStoreAdd AppGroup_DevSys "class=XTerm class=Alacritty class=Kitty class=Gnome-terminal class=Xfce4-terminal class=Code class=code-oss class=Sublime_text class=Geany class=FeatherPad class=featherpad class=Gedit class=Kate class=Thunar class=Nautilus class=Pcmanfm class=Nemo"

# --- 2. Web & Communication ---
InfoStoreAdd AppGroup_WebCom "class=Firefox class=firefox class=Chromium class=Google-chrome class=Brave-browser class=Thunderbird class=thunderbird* class=Evolution class=discord class=Slack class=TelegramDesktop class=Zathura"

# --- 3. Graphics, Office & Media ---
InfoStoreAdd AppGroup_GraphMed "class=Gimp* class=Inkscape class=Krita class=Blender class=scribus class=ColorPicker class=vlc class=mpv class=Spotify class=feh class=Viewnior class=ristretto class=gwenview class=Soffice class=libreoffice*"

#  Edit Menu
# ===========

DestroyFunc TriggerWindowLookUp
AddToFunc TriggerWindowLookUp
+ I WindowList Root c c

DestroyMenu MenuPanel
AddToMenu MenuPanel
+ "Restart" Restart
+ "Identify" NoWindow Module FvwmIdent
Test (x FvwmPrompt) + "Fvwm Prompt" Exec exec xterm -e FvwmPrompt
Test (!x FvwmPrompt) + "Fvwm Console" Module FvwmConsole -terminal
+ "Window List" TriggerWindowLookUp
+ "" Nop
+ "Apps" $[infostore.EDT] $[EXT_DIR]/Modules/FIconMan-Mgr/manager-menu.conf
+ "Mouse Actions" $[infostore.EDT] $[EXT_DIR]/Modules/FIconMan-Mgr/mouseActions.txt
+ "Fvwm Wallpapers" Popup BGMenu item -0 +17m

# Press Ctrl + R to reload configuration by restarting Fvwm3.

Key R A C Restart
